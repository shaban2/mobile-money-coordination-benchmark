<svg xmlns="http://www.w3.org/2000/svg" width="360" height="342" viewBox="0 0 360 342"><rect width="360" height="342" fill="white"/><g font-family="Arial, sans-serif" font-size="11.5" fill="#171717"><defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto-start-reverse"><path d="M0,0 L6,3 L0,6" fill="#555"/></marker></defs><text x="180" y="14" text-anchor="middle">One condition runs at a time</text><rect x="65" y="25" width="230" height="31" rx="3" fill="#f5f7f9" stroke="#5b6670" stroke-width=".8"/><text x="180" y="44.5" text-anchor="middle">k6 → HTTP gateway → transfer API</text><line x1="125" y1="56" x2="91" y2="78" stroke="#555" stroke-width="1" marker-end="url(#arrow)"/><line x1="235" y1="56" x2="271" y2="78" stroke="#555" stroke-width="1" marker-end="url(#arrow)"/><rect x="7" y="72" width="169" height="105" rx="4" fill="#f7fbfd" stroke="#176091"/><rect x="184" y="72" width="169" height="105" rx="4" fill="#fffaf6" stroke="#b34e00"/><text x="91" y="90" text-anchor="middle" font-weight="bold">REST app process</text><text x="269" y="90" text-anchor="middle" font-weight="bold">Kafka app process</text><text x="91" y="113" text-anchor="middle">Direct local workflow</text><text x="91" y="129" text-anchor="middle">calls and durable state</text><text x="91" y="158" text-anchor="middle">Four workers</text><text x="269" y="113" text-anchor="middle">Co-located event handlers</text><text x="269" y="129" text-anchor="middle">Durable inbox and outbox</text><text x="269" y="158" text-anchor="middle">Four workers</text><rect x="211" y="196" width="134" height="36" rx="3" fill="#f5f7f9" stroke="#5b6670" stroke-width=".8"/><text x="278" y="211.5" text-anchor="middle">Redpanda broker</text><text x="278" y="224.5" text-anchor="middle">Kafka condition only</text><line x1="249" y1="177" x2="249" y2="196" stroke="#555" stroke-width="1" marker-end="url(#arrow)"/><line x1="307" y1="196" x2="307" y2="177" stroke="#555" stroke-width="1" marker-end="url(#arrow)"/><line x1="91" y1="177" x2="91" y2="253" stroke="#555" stroke-width="1" marker-end="url(#arrow)"/><line x1="191" y1="177" x2="191" y2="253" stroke="#555" stroke-width="1" marker-end="url(#arrow)"/><rect x="16" y="255" width="328" height="39" rx="3" fill="#f5f7f9" stroke="#5b6670" stroke-width=".8"/><text x="180" y="272" text-anchor="middle">Both conditions use the same service types</text><text x="180" y="285" text-anchor="middle">PostgreSQL via Toxiproxy • HTTP provider adapter</text><text x="180" y="315" text-anchor="middle" font-size="10.8">Callbacks return through the gateway to the receiver</text><text x="180" y="332" text-anchor="middle" font-size="10.8">All services share one Docker host and one local ledger</text></g></svg>