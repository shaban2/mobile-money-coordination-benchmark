<svg xmlns="http://www.w3.org/2000/svg" width="360" height="160" viewBox="0 0 360 160"><rect width="360" height="160" fill="white"/><g font-family="Arial, sans-serif" font-size="11.5" fill="#171717"><defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto-start-reverse"><path d="M0,0 L6,3 L0,6" fill="#555"/></marker></defs><rect x="3" y="8" width="84" height="86" rx="4" fill="#f5f7f9" stroke="#5b6670" stroke-width="0.8"/><circle cx="13" cy="18" r="6.5" fill="#176091"/><text x="13" y="21.3" text-anchor="middle" fill="white" font-size="9" font-weight="bold">1</text><text x="45" y="37" text-anchor="middle" font-weight="bold" font-size="10">Sender</text><text x="45" y="52" text-anchor="middle" font-size="8.8">at Provider A</text><text x="45" y="64" text-anchor="middle" font-size="8.8">chooses recipient</text><text x="45" y="76" text-anchor="middle" font-size="8.8">and amount</text><line x1="87.5" y1="51" x2="91.5" y2="51" stroke="#555" stroke-width="1" marker-end="url(#arrow)"/><rect x="92" y="8" width="84" height="86" rx="4" fill="#f5f7f9" stroke="#5b6670" stroke-width="0.8"/><circle cx="102" cy="18" r="6.5" fill="#176091"/><text x="102" y="21.3" text-anchor="middle" fill="white" font-size="9" font-weight="bold">2</text><text x="134" y="37" text-anchor="middle" font-weight="bold" font-size="10">Transfer app</text><text x="134" y="52" text-anchor="middle" font-size="8.8">submits one P2P</text><text x="134" y="64" text-anchor="middle" font-size="8.8">transfer request</text><line x1="176.5" y1="51" x2="180.5" y2="51" stroke="#555" stroke-width="1" marker-end="url(#arrow)"/><rect x="181" y="8" width="84" height="86" rx="4" fill="#fff7e8" stroke="#b34e00" stroke-width="1.2"/><circle cx="191" cy="18" r="6.5" fill="#176091"/><text x="191" y="21.3" text-anchor="middle" fill="white" font-size="9" font-weight="bold">3</text><text x="223" y="37" text-anchor="middle" font-weight="bold" font-size="10">Unified API</text><text x="223" y="52" text-anchor="middle" font-size="8.8">routes the P2P</text><text x="223" y="64" text-anchor="middle" font-size="8.8">transfer to the</text><text x="223" y="76" text-anchor="middle" font-size="8.8">recipient provider</text><line x1="265.5" y1="51" x2="269.5" y2="51" stroke="#555" stroke-width="1" marker-end="url(#arrow)"/><rect x="270" y="8" width="84" height="86" rx="4" fill="#f5f7f9" stroke="#5b6670" stroke-width="0.8"/><circle cx="280" cy="18" r="6.5" fill="#176091"/><text x="280" y="21.3" text-anchor="middle" fill="white" font-size="9" font-weight="bold">4</text><text x="312" y="37" text-anchor="middle" font-weight="bold" font-size="10">Recipient</text><text x="312" y="52" text-anchor="middle" font-size="8.8">at Provider B</text><text x="312" y="64" text-anchor="middle" font-size="8.8">receives</text><text x="312" y="76" text-anchor="middle" font-size="8.8">the value</text><text x="223" y="103" text-anchor="middle" font-size="8" fill="#b34e00">measured in this paper</text><line x1="223" y1="106" x2="223" y2="116" stroke="#555" stroke-width="1" marker-end="url(#arrow)"/><rect x="8" y="118" width="344" height="36" rx="4" fill="#f5f7f9" stroke="#5b6670" stroke-width=".8"/><text x="180" y="132" text-anchor="middle" font-weight="bold" font-size="9.5">The sender receives the final result: COMPLETED or FAILED</text><text x="180" y="146" text-anchor="middle" font-size="8.8">If processing continues, the app first shows PENDING and gets the result later</text></g></svg>