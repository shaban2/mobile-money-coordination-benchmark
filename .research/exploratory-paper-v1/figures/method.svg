<svg xmlns="http://www.w3.org/2000/svg" width="360" height="268" viewBox="0 0 360 268"><rect width="360" height="268" fill="white"/><g font-family="Arial, sans-serif" font-size="11.5" fill="#171717"><defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto-start-reverse"><path d="M0,0 L6,3 L0,6" fill="#555"/></marker></defs><text x="4" y="11" font-weight="bold" font-size="9.5" fill="#333">A. Conditions (one REST run and one Kafka run each)</text><rect x="4" y="16" width="114" height="56" rx="3" fill="#f5f7f9" stroke="#5b6670" stroke-width=".8"/><text x="61" y="28" text-anchor="middle" font-size="9" font-weight="bold">No fault</text><text x="61" y="39" text-anchor="middle" font-size="8.4">8 operations/s</text><text x="61" y="50" text-anchor="middle" font-size="8.4">2 min warm-up + 4 min</text><rect x="123" y="16" width="114" height="56" rx="3" fill="#fff7e8" stroke="#b34e00" stroke-width=".8"/><text x="180" y="28" text-anchor="middle" font-size="9" font-weight="bold">Adapter outage</text><text x="180" y="39" text-anchor="middle" font-size="8.4">4 operations/s, 5 + 10 min</text><text x="180" y="50" text-anchor="middle" font-size="8.4">adapter container stopped</text><text x="180" y="61" text-anchor="middle" font-size="8.4">30 s at t = 240 s</text><rect x="242" y="16" width="114" height="56" rx="3" fill="#fff7e8" stroke="#b34e00" stroke-width=".8"/><text x="299" y="28" text-anchor="middle" font-size="9" font-weight="bold">Database delay</text><text x="299" y="39" text-anchor="middle" font-size="8.4">4 operations/s, 5 + 10 min</text><text x="299" y="50" text-anchor="middle" font-size="8.4">+100 ms per DB response</text><text x="299" y="61" text-anchor="middle" font-size="8.4">for 60 s at t = 240 s</text><text x="180" y="84" text-anchor="middle" font-size="7.6" fill="#444">Kafka-first pairs repeat both faults; earlier no-fault pairs at 4 operations/s add to the no-fault case</text><line x1="180" y1="88" x2="180" y2="100" stroke="#555" strok